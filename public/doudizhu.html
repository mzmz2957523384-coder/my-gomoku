<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="小游戏大厅" />
  <title>欢乐斗地主 - 写实实木牌桌</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 45%, #1d2f27 0%, #101b16 65%, #070d0a 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 6px 14px;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    /* 顶部融合切换栏 */
    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.45);
      padding: 3px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .nav-tab {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      color: rgba(255,255,255,0.65);
    }
    .nav-tab.active {
      background: linear-gradient(180deg, #b88a54 0%, #8a6032 100%);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* 大厅进房卡片 */
    #lobby {
      width: 100%;
      max-width: 390px;
      background: rgba(24, 28, 24, 0.9);
      border: 1px solid rgba(196, 164, 120, 0.28);
      color: #e7e2d8;
      padding: 22px 18px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
      margin-top: 24px;
      text-align: center;
    }
    #lobby h2 { margin: 0 0 6px; font-size: 21px; color: #f3e5cc; }
    input[type="text"] {
      width: 100%;
      padding: 11px;
      font-size: 16px;
      text-align: center;
      background: rgba(0,0,0,0.35);
      color: #fff;
      border: 1.5px solid rgba(196, 164, 120, 0.35);
      border-radius: 9px;
      margin-bottom: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #c2955d; }
    button {
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); opacity: 0.9; }
    .btn-gold {
      background: linear-gradient(180deg, #b88a54 0%, #8a6032 100%);
      color: #fff;
      width: 100%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    }
    .btn-light { background: rgba(255,255,255,0.12); color: #d6d3d1; width: 100%; margin-top: 8px; font-size: 14px; }

    /* ================= 牌桌主界面 ================= */
    #table {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 560px;
      flex: 1;
    }

    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .hud-pill {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(196, 164, 120, 0.22);
      border-radius: 10px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .bottom-cards { display: flex; gap: 4px; align-items: center; }
    .mini-card {
      width: 24px;
      height: 33px;
      background: #faf8f5;
      color: #1f2937;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.05;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .mini-card.back {
      background: linear-gradient(135deg, #2563eb, #1e3a8a);
      border: 1.5px solid #93c5fd;
      color: #dbeafe;
    }
    .mini-card.red { color: #dc2626; }
    .hud-btn {
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 7px;
      background: rgba(255,255,255,0.16);
      color: #fff;
    }

    /* 写实老实木弧形牌桌 */
    .poker-table {
      width: 100%;
      min-height: 295px;
      background-color: #a8763e;
      border: 7px solid #4a2b11;
      border-radius: 140px 140px 34px 34px / 65px 65px 26px 26px;
      box-shadow: inset 0 0 36px rgba(32, 14, 3, 0.55), 0 16px 36px rgba(0, 0, 0, 0.68), 0 6px 0 #2b1808;
      padding: 14px 10px 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .table-watermark {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 5px;
      color: rgba(45, 22, 5, 0.16);
      pointer-events: none;
      white-space: nowrap;
    }

    .table-opponents {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      z-index: 2;
      min-height: 118px;
    }
    .opp-side {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .opp-side.right { align-items: flex-end; text-align: right; }

    .seat-badge {
      background: rgba(20, 12, 5, 0.72);
      border: 1.5px solid rgba(255, 224, 178, 0.22);
      border-radius: 9px;
      padding: 5px 8px;
      max-width: 155px;
      backdrop-filter: blur(4px);
    }
    .seat-badge.active-turn {
      border-color: #fde047;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.75);
    }
    .seat-badge.empty {
      background: rgba(20, 12, 5, 0.35);
      border: 1.5px dashed rgba(255,255,255,0.38);
      color: rgba(255,255,255,0.88);
      font-size: 12px;
    }
    .seat-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .role-tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; font-weight: 800; }
    .role-landlord { background: #dc2626; color: #fff; }
    .role-peasant { background: #16a34a; color: #fff; }
    .seat-sub { font-size: 10px; color: #fde68a; margin-top: 2px; }
    .kick-ai {
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 4px;
    }

    .opp-cards-row { display: flex; align-items: center; gap: 6px; }
    .opp-side.right .opp-cards-row { flex-direction: row-reverse; }
    .card-back-count {
      width: 28px;
      height: 38px;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      border: 2px solid #e0f2fe;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .played-stack {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      padding-left: 10px;
      animation: popOnTable 0.2s ease-out;
    }
    @keyframes popOnTable {
      0% { transform: scale(0.82) translateY(8px); opacity: 0.4; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .table-card {
      width: 31px;
      height: 44px;
      background: #faf8f5;
      color: #1f2937;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      margin-left: -12px;
      padding: 2px 3px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font-weight: 800;
      box-shadow: -1px 2px 6px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }
    .table-card.red { color: #dc2626; }
    .table-card .tc-r { font-size: 12px; line-height: 1; }
    .table-card .tc-s { font-size: 11px; line-height: 1; }
    .table-card .tc-j { font-size: 9px; line-height: 1.05; }

    .shout-text {
      font-size: 20px;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 2px 5px rgba(35, 15, 0, 0.9), 0 0 2px #451a03;
      letter-spacing: 1px;
      animation: popOnTable 0.2s ease-out;
    }

    .table-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      min-height: 82px;
      gap: 6px;
    }
    .table-msg {
      background: rgba(28, 15, 4, 0.65);
      color: #fef3c7;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    .table-msg.my-turn {
      background: #15803d;
      color: #fff;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 2;
      min-height: 40px;
    }
    .controls button {
      padding: 9px 16px;
      font-size: 14px;
      border-radius: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      min-width: 78px;
    }
    .btn-ai { background: linear-gradient(180deg, #818cf8, #4f46e5); color: #fff; }
    .btn-start { background: linear-gradient(180deg, #4ade80, #16a34a); color: #fff; }
    .btn-play { background: linear-gradient(180deg, #4ade80, #15803d); color: #fff; }
    .btn-hint { background: linear-gradient(180deg, #fbbf24, #d97706); color: #fff; }
    .btn-pass { background: linear-gradient(180deg, #9ca3af, #4b5563); color: #fff; }
    .btn-bid { background: linear-gradient(180deg, #60a5fa, #2563eb); color: #fff; }

    .hand-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 6px 0 10px;
      user-select: none;
    }
    .hand-row { display: flex; justify-content: center; padding-left: 14px; }
    .poker-card {
      width: 42px;
      height: 64px;
      background: linear-gradient(180deg, #ffffff 0%, #f3f0ea 100%);
      border: 1.5px solid #cbd5e1;
      border-radius: 7px;
      margin-left: -14px;
      box-shadow: -2px 3px 8px rgba(0,0,0,0.42);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 3px 4px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.12s;
      color: #1e293b;
      position: relative;
      overflow: hidden;
    }
    .poker-card.red { color: #dc2626; }
    .poker-card.selected {
      transform: translateY(-16px);
      border-color: #facc15;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
    }
    .card-rank { font-size: 15px; line-height: 1; }
    .card-suit { font-size: 14px; line-height: 1.1; }
    .card-joker { font-size: 10px; line-height: 1.05; letter-spacing: 0.5px; }

    .landlord-ribbon {
      position: absolute;
      top: 4px;
      right: -13px;
      background: #dc2626;
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      padding: 1px 14px;
      transform: rotate(45deg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.35);
      pointer-events: none;
    }

    .bottom-hud {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }
    .my-status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.45);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid rgba(196, 164, 120, 0.2);
    }
    .tracker-bar {
      width: 100%;
      background: rgba(20, 15, 10, 0.88);
      border: 1.5px solid #854d0e;
      border-radius: 10px;
      padding: 4px 4px;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      text-align: center;
    }
    .tr-col { border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 1px; }
    .tr-col:last-child { border-right: none; }
    .tr-rank { font-size: 10px; font-weight: 700; color: #fde68a; }
    .tr-cnt { font-size: 11px; font-weight: 800; color: #fff; }
    .tr-cnt.zero { color: rgba(255,255,255,0.28); }

    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99;
    }
    .modal-box {
      background: #fff;
      color: #222;
      width: 100%;
      max-width: 340px;
      border-radius: 16px;
      padding: 20px 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    .diff-option {
      width: 100%;
      text-align: left;
      background: #f5f2eb;
      color: #222;
      padding: 11px 14px;
      margin-bottom: 8px;
      border: 2px solid transparent;
      border-radius: 10px;
    }
    .diff-option.active { border-color: #4f46e5; background: #eef2ff; }
    .diff-sub { display: block; font-size: 12px; font-weight: 400; color: #666; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="nav-tabs">
    <a href="/" class="nav-tab">⚫ 五子棋</a>
    <a href="/doudizhu.html" class="nav-tab active">🃏 斗地主</a>
  </div>

  <div id="lobby">
    <h2>🃏 欢乐斗地主</h2>
    <p style="margin:0 0 14px; font-size:13px; color:#a8a29e;">
      支持 1~3 人进房，人数不够可随时点 <strong>AI 补位</strong>
    </p>
    <input type="text" id="nameInput" placeholder="你的昵称（可选）" maxlength="10" />
    <input type="text" id="roomInput" placeholder="房间号，例如 8888" maxlength="20" />
    <button class="btn-gold" id="joinBtn">进入牌桌</button>
    <button class="btn-light" id="randomBtn">随机生成房间号</button>
  </div>

  <div id="table">
    <div class="hud-top">
      <div class="hud-pill">
        <span id="roomLabel">房:-</span>
        <button class="hud-btn" id="shareBtn">邀请</button>
        <button class="hud-btn" id="exitBtn">退出</button>
      </div>
      <div class="hud-pill">
        <div class="bottom-cards" id="bottomCards"></div>
        <span>倍:<strong id="multText" style="color:#fde047;">×1</strong></span>
      </div>
    </div>

    <div class="poker-table">
      <div class="table-watermark">欢乐斗地主</div>
      <div class="table-opponents">
        <div class="opp-side left" id="leftOpp"></div>
        <div class="opp-side right" id="rightOpp"></div>
      </div>
      <div class="table-center">
        <div class="table-msg" id="msgBanner">等待中...</div>
        <div id="myPlayedZone" style="min-height:46px; display:flex; align-items:center; justify-content:center;"></div>
      </div>
      <div class="controls" id="controlsBar"></div>
    </div>

    <div class="hand-container" id="handContainer"></div>

    <div class="bottom-hud">
      <div class="my-status-strip">
        <span id="myRoleText">我: -</span>
        <span id="myScoreText" style="color:#fde047; font-weight:800;">战绩: 0胜 | 0分</span>
      </div>
      <div class="tracker-bar" id="trackerBar"></div>
    </div>
  </div>

  <div class="modal-mask" id="aiModal">
    <div class="modal-box">
      <h3 style="margin:0 0 12px; font-size:18px;">🤖 选择 AI 补位等级</h3>
      <button class="diff-option" data-diff="easy">
        🌱 入门 AI
        <span class="diff-sub">出牌随性，适合休闲娱乐</span>
      </button>
      <button class="diff-option active" data-diff="medium">
        ⚔️ 普通 AI
        <span class="diff-sub">懂得配合队友，会留炸弹</span>
      </button>
      <button class="diff-option" data-diff="hard">
        🧠 高手 AI
        <span class="diff-sub">优先走顺子三带，紧盯残局</span>
      </button>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn-ai" id="addOneAiBtn" style="flex:1; border-radius:10px;">补位 1 个</button>
        <button class="btn-start" id="addAllAiBtn" style="flex:1; border-radius:10px;">补满空位</button>
      </div>
      <button class="btn-light" id="closeModalBtn" style="background:#e8e4dc; color:#333;">取消</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const lobbyEl = document.getElementById('lobby');
    const tableEl = document.getElementById('table');
    const nameInput = document.getElementById('nameInput');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const randomBtn = document.getElementById('randomBtn');
    const roomLabel = document.getElementById('roomLabel');
    const shareBtn = document.getElementById('shareBtn');
    const exitBtn = document.getElementById('exitBtn');
    const bottomCardsEl = document.getElementById('bottomCards');
    const multText = document.getElementById('multText');
    const leftOpp = document.getElementById('leftOpp');
    const rightOpp = document.getElementById('rightOpp');
    const msgBanner = document.getElementById('msgBanner');
    const myPlayedZone = document.getElementById('myPlayedZone');
    const controlsBar = document.getElementById('controlsBar');
    const myRoleText = document.getElementById('myRoleText');
    const myScoreText = document.getElementById('myScoreText');
    const handContainer = document.getElementById('handContainer');
    const trackerBar = document.getElementById('trackerBar');

    const aiModal = document.getElementById('aiModal');
    const diffOptions = document.querySelectorAll('.diff-option');
    let selectedAiDiff = 'medium';
    let state = null;
    let selectedIds = new Set();
    let seenPlayedIds = new Set();

    // 生成写实老橡木裂痕牌桌纹理
    (function applyRealWoodTable() {
      const c = document.createElement('canvas');
      const w = 520, h = 320;
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      let s = 987654;
      const rand = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);

      const bg = g.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, '#c2935b'); bg.addColorStop(0.5, '#ad7b44'); bg.addColorStop(1, '#8f602e');
      g.fillStyle = bg; g.fillRect(0, 0, w, h);

      const knots = [{ x: w * 0.18, y: h * 0.25, r: 26 }, { x: w * 0.82, y: h * 0.72, r: 24 }];
      for (let y = 0; y < h; y += 1.4) {
        g.strokeStyle = rand() > 0.35 ? `rgba(55,26,6,${0.05 + rand() * 0.11})` : `rgba(240,200,145,${0.03 + rand() * 0.06})`;
        g.lineWidth = 0.7 + rand() * 1.2;
        g.beginPath();
        const ph = rand() * 6.28, amp = 1.5 + rand() * 2.5;
        for (let x = 0; x <= w; x += 12) {
          let wy = y + Math.sin(x * 0.015 + ph) * amp;
          for (const k of knots) {
            const d = Math.hypot(x - k.x, wy - k.y);
            if (d < k.r * 2.2) wy += (wy >= k.y ? 1 : -1) * (1 - d / (k.r * 2.2)) * k.r * 0.5;
          }
          x === 0 ? g.moveTo(x, wy) : g.lineTo(x, wy);
        }
        g.stroke();
      }
      for (const k of knots) {
        for (let r = 3; r >= 1; r--) {
          g.beginPath(); g.ellipse(k.x, k.y, k.r * r * 0.32, k.r * r * 0.15, 0.15, 0, Math.PI * 2);
          g.strokeStyle = 'rgba(48,22,4,0.18)'; g.lineWidth = 1.1; g.stroke();
        }
      }
      [[0, 75, 0.05, 130, 2.4], [w, 210, 3.1, 145, 2.5], [160, 0, 1.4, 55, 1.7], [w * 0.78, h, -1.5, 60, 1.8]].forEach(([sx, sy, ang, len, mw]) => {
        let cx = sx, cy = sy, ca = ang;
        g.lineCap = 'round';
        for (let i = 0; i < len / 5; i++) {
          ca += (rand() - 0.5) * 0.32;
          const nx = cx + Math.cos(ca) * 5, ny = cy + Math.sin(ca) * 5;
          const lw = mw * (1 - (i / (len / 5)) * 0.8);
          g.beginPath(); g.moveTo(cx, cy + 1.1); g.lineTo(nx, ny + 1.1);
          g.strokeStyle = 'rgba(245,210,155,0.28)'; g.lineWidth = lw * 0.8; g.stroke();
          g.beginPath(); g.moveTo(cx, cy); g.lineTo(nx, ny);
          g.strokeStyle = 'rgba(24,10,2,0.78)'; g.lineWidth = lw; g.stroke();
          cx = nx; cy = ny;
        }
      });
      for (let i = 0; i < 1600; i++) {
        g.fillStyle = rand() > 0.4 ? 'rgba(40,18,4,0.12)' : 'rgba(245,210,160,0.06)';
        g.fillRect(rand() * w, rand() * h, 1 + rand() * 2, 1);
      }
      const tbl = document.querySelector('.poker-table');
      if (tbl) {
        tbl.style.backgroundImage = `url(${c.toDataURL()})`;
        tbl.style.backgroundSize = 'cover';
      }
    })();

    const urlParams = new URLSearchParams(window.location.search);
    roomInput.value = urlParams.get('room') || Math.floor(1000 + Math.random() * 9000);
    randomBtn.onclick = () => { roomInput.value = Math.floor(1000 + Math.random() * 9000); };

    diffOptions.forEach(btn => {
      btn.onclick = () => {
        diffOptions.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAiDiff = btn.dataset.diff;
      };
    });

    joinBtn.onclick = () => {
      const id = roomInput.value.trim();
      if (!id) return alert('请输入房间号');
      socket.emit('ddz:joinRoom', { roomId: id, name: nameInput.value.trim() });
    };

    document.getElementById('addOneAiBtn').onclick = () => {
      socket.emit('ddz:addAi', { diff: selectedAiDiff, fillAll: false });
      aiModal.style.display = 'none';
    };
    document.getElementById('addAllAiBtn').onclick = () => {
      socket.emit('ddz:addAi', { diff: selectedAiDiff, fillAll: true });
      aiModal.style.display = 'none';
    };
    document.getElementById('closeModalBtn').onclick = () => { aiModal.style.display = 'none'; };

    shareBtn.onclick = async () => {
      const url = window.location.href;
      try { await navigator.clipboard.writeText(url); alert('斗地主房间链接已复制！\n' + url); }
      catch { prompt('请复制链接发给好友：', url); }
    };
    exitBtn.onclick = () => { window.location.href = window.location.pathname; };

    socket.on('ddz:error', (msg) => alert(msg));

    socket.on('ddz:joined', ({ roomId }) => {
      lobbyEl.style.display = 'none';
      tableEl.style.display = 'flex';
      roomLabel.textContent = `房:${roomId}`;
      window.history.replaceState({}, '', `${window.location.pathname}?room=${encodeURIComponent(roomId)}`);
    });

    socket.on('ddz:hintResult', (ids) => {
      if (!ids || ids.length === 0) return alert('没有能管上上家的牌，请点“不出”');
      selectedIds = new Set(ids);
      renderHand();
    });

    socket.on('ddz:state', (newState) => {
      if (newState.phase === 'waiting' || newState.phase === 'bidding') {
        seenPlayedIds.clear();
      } else if (newState.phase === 'playing' || newState.phase === 'finished') {
        for (const c of (newState.lastPlayCards || [])) seenPlayedIds.add(c.id);
        for (const s of newState.seats) {
          if (s && s.playedCards) s.playedCards.forEach(c => seenPlayedIds.add(c.id));
        }
      }
      state = newState;
      const myIds = new Set(state.myHand.map(c => c.id));
      selectedIds = new Set([...selectedIds].filter(id => myIds.has(id)));
      render();
    });

    function makeMiniCardsHtml(cards) {
      return cards.map(c => {
        const red = c.color === 'red' ? 'red' : '';
        const text = (c.val >= 16) ? (c.val === 17 ? '大' : '小') : `${c.label}<br>${c.suit}`;
        return `<div class="mini-card ${red}">${text}</div>`;
      }).join('');
    }

    function makeTableCardsHtml(cards, isLandlord) {
      return `<div class="played-stack">` + cards.map((c, idx) => {
        const red = c.color === 'red' ? 'red' : '';
        const ribbon = (isLandlord && idx === cards.length - 1) ? `<div class="landlord-ribbon">地主</div>` : '';
        const inner = c.val >= 16
          ? `<span class="tc-j">${c.val === 17 ? '大<br>王' : '小<br>王'}</span>`
          : `<span class="tc-r">${c.label}</span><span class="tc-s">${c.suit}</span>`;
        return `<div class="table-card ${red}">${ribbon}${inner}</div>`;
      }).join('') + `</div>`;
    }

    function renderOpponent(container, idx) {
      const seat = state.seats[idx];
      const isTurn = (state.phase === 'bidding' || state.phase === 'playing') && state.turnIdx === idx;

      if (!seat) {
        container.innerHTML = `<div class="seat-badge empty">空座位（待加入）</div>`;
        return;
      }

      const roleTag = state.landlordIdx === idx
        ? `<span class="role-tag role-landlord">地主</span>`
        : (state.landlordIdx >= 0 ? `<span class="role-tag role-peasant">农民</span>` : '');
      const kickBtn = (state.phase === 'waiting' && seat.type === 'ai')
        ? `<button class="kick-ai" onclick="removeAi(${idx})">移除</button>` : '';
      const countBox = (state.phase === 'bidding' || state.phase === 'playing')
        ? `<div class="card-back-count">${seat.cardCount}</div>` : '';

      let playArea = '';
      if (seat.action) {
        playArea = `<div class="shout-text">${seat.action}</div>`;
      } else if (seat.playedCards && seat.playedCards.length > 0) {
        playArea = makeTableCardsHtml(seat.playedCards, state.landlordIdx === idx);
      } else if (state.phase === 'finished' && seat.revealedHand && seat.revealedHand.length > 0) {
        playArea = makeTableCardsHtml(seat.revealedHand, state.landlordIdx === idx);
      }

      container.innerHTML = `
        <div class="seat-badge ${isTurn ? 'active-turn' : ''}">
          <div class="seat-name-row">${roleTag}<span>${seat.name}</span>${kickBtn}</div>
          <div class="seat-sub">${seat.wins}胜 · ${seat.score >= 0 ? '+' : ''}${seat.score}分</div>
        </div>
        <div class="opp-cards-row">
          ${countBox}
          ${playArea}
        </div>
      `;
    }

    window.removeAi = (idx) => socket.emit('ddz:removeAi', idx);

    function renderTracker() {
      const ranks = [
        { val: 17, label: '大', total: 1 }, { val: 16, label: '小', total: 1 },
        { val: 15, label: '2', total: 4 }, { val: 14, label: 'A', total: 4 },
        { val: 13, label: 'K', total: 4 }, { val: 12, label: 'Q', total: 4 },
        { val: 11, label: 'J', total: 4 }, { val: 10, label: '10', total: 4 },
        { val: 9, label: '9', total: 4 }, { val: 8, label: '8', total: 4 },
        { val: 7, label: '7', total: 4 }, { val: 6, label: '6', total: 4 },
        { val: 5, label: '5', total: 4 }, { val: 4, label: '4', total: 4 },
        { val: 3, label: '3', total: 4 }
      ];
      const playingOrEnded = state.phase === 'playing' || state.phase === 'finished';
      const myCounts = new Map();
      for (const c of state.myHand) myCounts.set(c.val, (myCounts.get(c.val) || 0) + 1);
      const playedCounts = new Map();
      for (const id of seenPlayedIds) {
        const v = id === 53 ? 17 : (id === 52 ? 16 : Math.floor(id / 4) + 3);
        playedCounts.set(v, (playedCounts.get(v) || 0) + 1);
      }

      trackerBar.innerHTML = ranks.map(r => {
        const rem = playingOrEnded
          ? Math.max(0, r.total - (myCounts.get(r.val) || 0) - (playedCounts.get(r.val) || 0))
          : r.total;
        return `<div class="tr-col">
          <span class="tr-rank">${r.label}</span>
          <span class="tr-cnt ${rem === 0 ? 'zero' : ''}">${rem}</span>
        </div>`;
      }).join('');
    }

    function render() {
      if (!state) return;
      const myIdx = state.mySeatIdx;
      const leftIdx = (myIdx + 2) % 3;
      const rightIdx = (myIdx + 1) % 3;

      multText.textContent = `×${state.multiplier}`;
      if (state.bottomCards && state.bottomCards.length === 3) {
        bottomCardsEl.innerHTML = makeMiniCardsHtml(state.bottomCards);
      } else {
        bottomCardsEl.innerHTML = `<div class="mini-card back">?</div><div class="mini-card back">?</div><div class="mini-card back">?</div>`;
      }

      renderOpponent(leftOpp, leftIdx);
      renderOpponent(rightOpp, rightIdx);

      const mySeat = state.seats[myIdx];
      const isMyTurn = (state.phase === 'bidding' || state.phase === 'playing') && state.turnIdx === myIdx;
      msgBanner.className = 'table-msg' + (isMyTurn ? ' my-turn' : '');
      msgBanner.textContent = state.message;

      const myRole = state.landlordIdx === myIdx ? '👑 地主' : (state.landlordIdx >= 0 ? '🌾 农民' : '待定');
      myRoleText.textContent = `${mySeat.name} (${myRole})`;
      myScoreText.textContent = `战绩: ${mySeat.wins}胜 | ${mySeat.score >= 0 ? '+' : ''}${mySeat.score}分`;

      if (mySeat.action) {
        myPlayedZone.innerHTML = `<div class="shout-text">${mySeat.action}</div>`;
      } else if (mySeat.playedCards && mySeat.playedCards.length > 0) {
        myPlayedZone.innerHTML = makeTableCardsHtml(mySeat.playedCards, state.landlordIdx === myIdx);
      } else {
        myPlayedZone.innerHTML = '';
      }

      controlsBar.innerHTML = '';
      const hasEmpty = state.seats.some(s => s === null);

      if (state.phase === 'waiting') {
        if (hasEmpty) {
          const btn = document.createElement('button');
          btn.className = 'btn-ai';
          btn.textContent = '🤖 AI 补位（选等级）';
          btn.onclick = () => { aiModal.style.display = 'flex'; };
          controlsBar.appendChild(btn);
        } else {
          const btn = document.createElement('button');
          btn.className = 'btn-start';
          btn.textContent = '🃏 3人已满，开始发牌！';
          btn.onclick = () => socket.emit('ddz:startGame');
          controlsBar.appendChild(btn);
        }
      } else if (state.phase === 'bidding' && isMyTurn) {
        const passBtn = document.createElement('button');
        passBtn.className = 'btn-pass';
        passBtn.textContent = '不叫';
        passBtn.onclick = () => socket.emit('ddz:bid', 0);
        controlsBar.appendChild(passBtn);

        for (let b = 1; b <= 3; b++) {
          if (b > state.highestBid) {
            const bidBtn = document.createElement('button');
            bidBtn.className = 'btn-bid';
            bidBtn.textContent = `${b} 分`;
            bidBtn.onclick = () => socket.emit('ddz:bid', b);
            controlsBar.appendChild(bidBtn);
          }
        }
      } else if (state.phase === 'playing' && isMyTurn) {
        const canPass = state.lastPlayCards.length > 0 && state.lastPlaySeat !== myIdx;
        if (canPass) {
          const passBtn = document.createElement('button');
          passBtn.className = 'btn-pass';
          passBtn.textContent = '不出';
          passBtn.onclick = () => { selectedIds.clear(); socket.emit('ddz:pass'); };
          controlsBar.appendChild(passBtn);
        }
        const hintBtn = document.createElement('button');
        hintBtn.className = 'btn-hint';
        hintBtn.textContent = '💡 提示';
        hintBtn.onclick = () => socket.emit('ddz:hint');
        controlsBar.appendChild(hintBtn);

        const playBtn = document.createElement('button');
        playBtn.className = 'btn-play';
        playBtn.textContent = '出牌';
        playBtn.onclick = () => {
          if (selectedIds.size === 0) return alert('请先点选要出的牌');
          socket.emit('ddz:play', [...selectedIds]);
        };
        controlsBar.appendChild(playBtn);
      } else if (state.phase === 'finished') {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn-start';
        nextBtn.textContent = '🃏 再来一局';
        nextBtn.onclick = () => { selectedIds.clear(); socket.emit('ddz:startGame'); };
        controlsBar.appendChild(nextBtn);
      }

      renderHand();
      renderTracker();
    }

    function renderHand() {
      handContainer.innerHTML = '';
      if (!state || !state.myHand || state.myHand.length === 0) return;
      const cards = state.myHand;
      const isLandlord = state.landlordIdx === state.mySeatIdx;
      const rows = cards.length > 10 ? [cards.slice(0, 10), cards.slice(10)] : [cards];

      rows.forEach((rowCards, rIdx) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'hand-row';
        rowCards.forEach((c, cIdx) => {
          const cardEl = document.createElement('div');
          cardEl.className = 'poker-card' +
            (c.color === 'red' ? ' red' : '') +
            (selectedIds.has(c.id) ? ' selected' : '');

          const isLastCard = (rIdx === rows.length - 1) && (cIdx === rowCards.length - 1);
          const ribbon = (isLandlord && isLastCard) ? `<div class="landlord-ribbon">地主</div>` : '';

          if (c.val >= 16) {
            cardEl.innerHTML = `${ribbon}<span class="card-joker">J<br>O<br>K<br>E<br>R</span>`;
          } else {
            cardEl.innerHTML = `${ribbon}<span class="card-rank">${c.label}</span><span class="card-suit">${c.suit}</span>`;
          }

          cardEl.onclick = () => {
            if (selectedIds.has(c.id)) selectedIds.delete(c.id);
            else selectedIds.add(c.id);
            cardEl.classList.toggle('selected');
          };
          rowEl.appendChild(cardEl);
        });
        handContainer.appendChild(rowEl);
      });
    }
  </script>
</body>
</html>
