<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="小游戏大厅" />
  <title>五子棋 - 写实实木版</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* 深林树荫斑驳光影背景（无卡通元素） */
      background:
        radial-gradient(circle at 22% 14%, rgba(163, 190, 128, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 80% 24%, rgba(214, 185, 130, 0.11) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 55%, #1d281f 0%, #111913 62%, #090e0a 100%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 10px 24px;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.45);
      padding: 3px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .nav-tab {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      color: rgba(255,255,255,0.65);
    }
    .nav-tab.active {
      background: linear-gradient(180deg, #b88a54 0%, #8a6032 100%);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    h1 {
      margin: 2px 0 12px;
      font-size: 21px;
      color: #e7dcc8;
      text-shadow: 0 2px 6px rgba(0,0,0,0.65);
      letter-spacing: 3px;
      font-weight: 700;
    }

    /* 大厅卡片 */
    #lobby {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: rgba(24, 28, 24, 0.88);
      border: 1px solid rgba(196, 164, 120, 0.25);
      color: #e7e2d8;
      padding: 20px 18px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
    }
    .card-title { font-size: 17px; font-weight: 700; margin: 0 0 6px; color: #f3e5cc; }
    .card-desc { font-size: 13px; color: #a8a29e; margin: 0 0 14px; }
    .invite-highlight { border-color: #65a30d; background: rgba(24, 34, 22, 0.92); }

    input[type="text"] {
      width: 100%;
      padding: 11px;
      font-size: 17px;
      text-align: center;
      background: rgba(0,0,0,0.35);
      color: #fff;
      border: 1.5px solid rgba(196, 164, 120, 0.35);
      border-radius: 9px;
      margin-bottom: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #c2955d; }

    .diff-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .diff-btn {
      flex: 1;
      padding: 9px 6px;
      font-size: 14px;
      background: rgba(255,255,255,0.08);
      color: #d6d3d1;
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
    }
    .diff-btn.active { background: rgba(184, 138, 84, 0.28); color: #fde68a; border-color: #c2955d; }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { opacity: 0.85; transform: scale(0.98); }
    .btn-green {
      background: linear-gradient(180deg, #4d7c0f 0%, #365314 100%);
      color: #fff;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-blue {
      background: linear-gradient(180deg, #a17440 0%, #785126 100%);
      color: #fff;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-light {
      background: rgba(255,255,255,0.1);
      color: #d6d3d1;
      width: 100%;
      margin-top: 8px;
      font-size: 14px;
      padding: 9px;
    }

    /* 对战界面 */
    #game { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 500px; }
    .info-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(196, 164, 120, 0.22);
      padding: 9px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #e7dcc8;
    }

    .score-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(196, 164, 120, 0.22);
      padding: 7px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .score-item { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .score-label { font-size: 11px; color: #a8a29e; }
    .score-num { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.2; }
    .score-win .score-num { color: #84cc16; }
    .score-lose .score-num { color: #f87171; }
    .score-divider { width: 1px; height: 26px; background: rgba(255,255,255,0.12); }
    #resetScoreBtn {
      background: rgba(255,255,255,0.1);
      color: #d6d3d1;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 7px;
      margin-left: 4px;
      display: none;

    .status-banner {
      width: 100%;
      text-align: center;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: #e7dcc8;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .status-my-turn {
      background: rgba(54, 83, 20, 0.9);
      color: #ecfccb;
      border-color: rgba(132, 204, 22, 0.5);
    }
    .status-win {
      background: rgba(146, 64, 14, 0.92);

    }

    /* 写实厚实木盘座 */
    .board-frame {
      padding: 7px;
      background: linear-gradient(145deg, #5e3a1c, #3b220d);
      border-radius: 8px;

      box-shadow: 0 18px 40px rgba(0,0,0,0.75), 0 7px 0 #261506;
    }
    canvas {
      display: block;
      border-radius: 3px;
      touch-action: none;
    }

    .controls {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .controls button {
      flex: 1;
      min-width: 105px;

      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    #confirmBtn { background: linear-gradient(180deg, #65a30d, #3f6212); color: #fff; flex: 2; min-width: 150px; display: none; }
    #undoBtn { background: rgba(255,255,255,0.16); color: #fff; display: none; }
    #restartBtn { background: linear-gradient(180deg, #d97706, #92400e); color: #fff; display: none; }
    #shareBtn { background: linear-gradient(180deg, #3b82f6, #1d4ed8); color: #fff; display: none; }
    #backBtn { background: rgba(255,255,255,0.12); color: #d6d3d1; border: 1px solid rgba(255,255,255,0.12); }

    .tip { font-size: 12px; color: rgba(231, 220, 200, 0.58); margin-top: 10px; text-align: center; }

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const lobbyEl = document.getElementById('lobby');
    const gameEl = document.getElementById('game');
    const inviteCard = document.getElementById('inviteCard');
    const inviteRoomText = document.getElementById('inviteRoomText');
    const quickJoinBtn = document.getElementById('quickJoinBtn');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const randomBtn = document.getElementById('randomBtn');
    const startAiBtn = document.getElementById('startAiBtn');
    const diffBtns = document.querySelectorAll('.diff-btn');

    const roomLabel = document.getElementById('roomLabel');
    const roleLabel = document.getElementById('roleLabel');
    const myScoreLabel = document.getElementById('myScoreLabel');
    const myScoreNum = document.getElementById('myScoreNum');
    const drawScoreNum = document.getElementById('drawScoreNum');
    const oppScoreLabel = document.getElementById('oppScoreLabel');
    const oppScoreNum = document.getElementById('oppScoreNum');
    const resetScoreBtn = document.getElementById('resetScoreBtn');

    const statusBanner = document.getElementById('statusBanner');
    const confirmBtn = document.getElementById('confirmBtn');
    const undoBtn = document.getElementById('undoBtn');
    const restartBtn = document.getElementById('restartBtn');
    const shareBtn = document.getElementById('shareBtn');
    const backBtn = document.getElementById('backBtn');
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    let mode = '';
    let previewPos = null;
    let onlineState = null;
    let myColor = 0;
    let lastOnlineMoveCount = 0;

    let aiDiff = 'medium';
    let aiBoard = [];
    let aiTurn = 1;
    let aiWinner = 0;
    let aiLastMove = null;
    let aiHistory = [];
    let aiThinking = false;
    let aiTimer = null;
    let aiStats = loadAiStats();

    function loadAiStats() {
      try {
        const saved = JSON.parse(localStorage.getItem('gomoku_ai_stats'));
        if (saved && typeof saved.win === 'number') return saved;
      } catch {}
      return { win: 0, lose: 0, draw: 0 };
    }
    function saveAiStats() {
      try { localStorage.setItem('gomoku_ai_stats', JSON.stringify(aiStats)); } catch {}
    }

    // 确定性随机数，保证每次画出来的木纹与裂痕固定不动
    function makeRng(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    // 缓存写实木纹背景画布（含木纤维、木结、裂痕、包浆）
    let boardBgCanvas = document.createElement('canvas');
    let boardPx = 350;
    let padding = 18;
    let cellSize = 23;

    function buildRealisticWoodBoard(size, dpr) {
      boardBgCanvas.width = size * dpr;
      boardBgCanvas.height = size * dpr;
      const bctx = boardBgCanvas.getContext('2d');
      bctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const rand = makeRng(20261113);

      // 1. 基础天然老木底色（偏真实原木暖棕，非艳黄卡通色）
      const baseGrad = bctx.createLinearGradient(0, 0, size, size);
      baseGrad.addColorStop(0, '#c69a63');
      baseGrad.addColorStop(0.45, '#b6874e');
      baseGrad.addColorStop(1, '#9e6f3a');
      bctx.fillStyle = baseGrad;
      bctx.fillRect(0, 0, size, size);

      // 2. 不均匀天然木材色斑（深浅块状过渡）
      for (let i = 0; i < 12; i++) {
        const rx = rand() * size;
        const ry = rand() * size;
        const rad = size * (0.18 + rand() * 0.25);
        const spot = bctx.createRadialGradient(rx, ry, 2, rx, ry, rad);
        const dark = rand() > 0.45;
        spot.addColorStop(0, dark ? 'rgba(68, 36, 10, 0.14)' : 'rgba(235, 198, 140, 0.12)');
        spot.addColorStop(1, 'rgba(0, 0, 0, 0)');
        bctx.fillStyle = spot;
        bctx.fillRect(0, 0, size, size);
      }

      // 3. 密集纵向/横向木纤维纹理（模拟真实木纹走向）
      const knots = [
        { x: size * 0.16, y: size * 0.22, r: size * 0.08 },
        { x: size * 0.84, y: size * 0.78, r: size * 0.075 }
      ];

      for (let y = 0; y < size; y += 1.4) {
        const isDarkFiber = rand() > 0.3;
        bctx.strokeStyle = isDarkFiber
          ? `rgba(62, 31, 8, ${0.04 + rand() * 0.11})`
          : `rgba(242, 210, 160, ${0.03 + rand() * 0.07})`;
        bctx.lineWidth = 0.6 + rand() * 1.1;
        bctx.beginPath();
        const phase = rand() * Math.PI * 2;
        const amp = 1.2 + rand() * 2.5;
        for (let x = 0; x <= size; x += 10) {
          let wy = y + Math.sin(x * 0.018 + phase) * amp;
          // 遇到木结处自然绕流变形
          for (const k of knots) {
            const dx = x - k.x, dy = wy - k.y;
            const dist = Math.hypot(dx, dy);
            if (dist < k.r * 2.2) {
              const push = (1 - dist / (k.r * 2.2)) * k.r * 0.55;
              wy += (dy >= 0 ? 1 : -1) * push;
            }
          }
          if (x === 0) bctx.moveTo(x, wy);
          else bctx.lineTo(x, wy);
        }
        bctx.stroke();
      }

      // 4. 画真实的树结（年轮圈）
      for (const k of knots) {
        for (let ring = 4; ring >= 1; ring--) {
          bctx.beginPath();
          bctx.ellipse(k.x, k.y, k.r * ring * 0.32, k.r * ring * 0.16, 0.15, 0, Math.PI * 2);
          bctx.strokeStyle = `rgba(52, 24, 5, ${0.12 + (5 - ring) * 0.04})`;
          bctx.lineWidth = 1.1;
          bctx.stroke();
        }
        const core = bctx.createRadialGradient(k.x, k.y, 1, k.x, k.y, k.r * 0.4);
        core.addColorStop(0, 'rgba(42, 18, 4, 0.48)');
        core.addColorStop(1, 'rgba(42, 18, 4, 0)');
        bctx.fillStyle = core;
        bctx.beginPath();
        bctx.arc(k.x, k.y, k.r * 0.45, 0, Math.PI * 2);
        bctx.fill();
      }

      // 5. 画真实的木头裂痕（锯齿形裂纹 + 深缝 + 边缘高光立体感）
      function drawWoodCrack(startX, startY, angle, length, maxWidth) {
        const pts = [{ x: startX, y: startY }];
        let cx = startX, cy = startY, curAng = angle;
        const steps = Math.floor(length / 5);
        for (let i = 0; i < steps; i++) {
          curAng += (rand() - 0.5) * 0.35;
          cx += Math.cos(curAng) * 5;
          cy += Math.sin(curAng) * 5;
          pts.push({ x: cx, y: cy });
        }

        // 裂痕周围轻微渗色晕染
        bctx.lineCap = 'round';
        bctx.lineJoin = 'round';
        for (let i = 1; i < pts.length; i++) {
          const progress = i / pts.length;
          const w = maxWidth * (1 - progress * 0.82);

          // 晕染阴影
          bctx.beginPath();
          bctx.moveTo(pts[i - 1].x, pts[i - 1].y);
          bctx.lineTo(pts[i].x, pts[i].y);
          bctx.strokeStyle = 'rgba(40, 18, 4, 0.16)';
          bctx.lineWidth = w + 3.2;
          bctx.stroke();

          // 裂纹下沿微弱受光边缘（产生真实凹陷感）
          bctx.beginPath();
          bctx.moveTo(pts[i - 1].x, pts[i - 1].y + 1.1);
          bctx.lineTo(pts[i].x, pts[i].y + 1.1);
          bctx.strokeStyle = 'rgba(245, 212, 160, 0.28)';
          bctx.lineWidth = Math.max(0.5, w * 0.7);
          bctx.stroke();

          // 深黑裂隙主缝
          bctx.beginPath();
          bctx.moveTo(pts[i - 1].x, pts[i - 1].y);
          bctx.lineTo(pts[i].x, pts[i].y);
          bctx.strokeStyle = `rgba(28, 12, 3, ${0.78 - progress * 0.3})`;
          bctx.lineWidth = Math.max(0.4, w);
          bctx.stroke();
        }
      }

      // 分布几道自然干裂纹（边缘起裂 + 树结旁小裂纹）
      drawWoodCrack(0, size * 0.19, 0.06, size * 0.24, 2.3);
      drawWoodCrack(size, size * 0.67, Math.PI - 0.08, size * 0.28, 2.5);
      drawWoodCrack(size * 0.34, size, -Math.PI * 0.45, size * 0.12, 1.8);
      drawWoodCrack(size * 0.14, size * 0.22, 0.12, size * 0.13, 1.4);
      drawWoodCrack(size * 0.85, size * 0.78, Math.PI + 0.05, size * 0.14, 1.5);

      // 6. 细微木孔质感颗粒
      for (let i = 0; i < 1800; i++) {
        bctx.fillStyle = rand() > 0.4 ? 'rgba(55, 25, 6, 0.12)' : 'rgba(250, 220, 175, 0.07)';
        bctx.fillRect(rand() * size, rand() * size, 1 + rand() * 2.2, 1);
      }

      // 7. 四周做旧暗角包浆
      const vig = bctx.createRadialGradient(size / 2, size / 2, size * 0.3, size / 2, size / 2, size * 0.76);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(32, 15, 3, 0.34)');
      bctx.fillStyle = vig;
      bctx.fillRect(0, 0, size, size);

      // 8. 清晰的15x15深色刻线网格（保证在真实木纹上依然清晰可读）
      bctx.strokeStyle = 'rgba(28, 14, 4, 0.82)';
      bctx.lineWidth = 1.1;
      for (let i = 0; i < 15; i++) {
        const pos = padding + i * cellSize;
        bctx.beginPath(); bctx.moveTo(padding, pos); bctx.lineTo(size - padding, pos); bctx.stroke();
        bctx.beginPath(); bctx.moveTo(pos, padding); bctx.lineTo(pos, size - padding); bctx.stroke();
      }

      const stars = [[3,3], [11,3], [7,7], [3,11], [11,11]];
      bctx.fillStyle = 'rgba(24, 11, 3, 0.88)';
      for (const [sx, sy] of stars) {
        bctx.beginPath();
        bctx.arc(padding + sx * cellSize, padding + sy * cellSize, 3.3, 0, Math.PI * 2);
        bctx.fill();
      }
    }

    let animPiece = null;
    let rafId = null;
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function startDropAnimation(x, y, color) {
      if (rafId) cancelAnimationFrame(rafId);
      animPiece = { x, y, color, startTime: performance.now(), duration: 240 };
      function tick(now) {
        drawBoard(now);
        if (animPiece) {
          if (now - animPiece.startTime < animPiece.duration) {
            rafId = requestAnimationFrame(tick);
          } else {
            animPiece = null; rafId = null; drawBoard();
          }
        }
      }
      rafId = requestAnimationFrame(tick);
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      boardPx = Math.min(window.innerWidth - 34, 450);
      padding = boardPx * 0.055;
      cellSize = (boardPx - padding * 2) / 14;

      canvas.style.width = boardPx + 'px';
      canvas.style.height = boardPx + 'px';
      canvas.width = boardPx * dpr;
      canvas.height = boardPx * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      buildRealisticWoodBoard(boardPx, dpr);
      drawBoard();
    }
    window.addEventListener('resize', resizeCanvas);

    diffBtns.forEach(btn => {
      btn.onclick = () => {
        diffBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        aiDiff = btn.dataset.diff;
      };
    });

    const urlParams = new URLSearchParams(window.location.search);
    const inviteRoom = urlParams.get('room');
    if (inviteRoom) {
      roomInput.value = inviteRoom;
      inviteRoomText.textContent = inviteRoom;
      inviteCard.style.display = 'block';
    } else {
      roomInput.value = Math.floor(1000 + Math.random() * 9000);
    }
    randomBtn.onclick = () => { roomInput.value = Math.floor(1000 + Math.random() * 9000); };

    function enterOnlineRoom(roomId) {
      const id = String(roomId || '').trim();
      if (!id) return alert('请输入房间号');
      mode = 'online';
      lastOnlineMoveCount = 0;
      socket.emit('joinRoom', id);
    }
    joinBtn.onclick = () => enterOnlineRoom(roomInput.value);
    quickJoinBtn.onclick = () => enterOnlineRoom(inviteRoom);

    socket.on('errorMsg', (msg) => alert(msg));

    socket.on('joined', ({ roomId }) => {
      mode = 'online';
      lobbyEl.style.display = 'none';
      gameEl.style.display = 'flex';
      roomLabel.textContent = `房间: ${roomId}`;
      window.history.replaceState({}, '', `${window.location.pathname}?room=${encodeURIComponent(roomId)}`);
      resizeCanvas();
    });

    socket.on('opponentLeft', () => {
      previewPos = null; animPiece = null; lastOnlineMoveCount = 0;
      alert('对方已离开房间，棋局与比分已重置');
    });

    socket.on('gameState', (state) => {
      if (mode !== 'online') return;
      const shouldAnimate = state.moveCount > lastOnlineMoveCount && state.lastMove && lastOnlineMoveCount >= 0;
      onlineState = state;
      myColor = (socket.id === state.blackId) ? 1 : (socket.id === state.whiteId ? 2 : 0);
      previewPos = null;
      if (state.moveCount === 0) animPiece = null;
      updateUI();
      if (shouldAnimate && state.moveCount > 0) {
        const lm = state.lastMove;
        startDropAnimation(lm.x, lm.y, state.board[lm.y][lm.x]);
      } else {
        drawBoard();
      }
      lastOnlineMoveCount = state.moveCount;
    });

    function createEmptyBoard() { return Array.from({ length: 15 }, () => Array(15).fill(0)); }

    function startAiGame() {
      if (aiTimer) clearTimeout(aiTimer);
      if (rafId) cancelAnimationFrame(rafId);
      animPiece = null; mode = 'ai'; aiBoard = createEmptyBoard();
      aiTurn = 1; aiWinner = 0; aiLastMove = null; aiHistory = [];
      aiThinking = false; previewPos = null;

      const diffNames = { easy: '入门', medium: '普通', hard: '高手' };
      lobbyEl.style.display = 'none';
      gameEl.style.display = 'flex';
      roomLabel.textContent = `AI模式 (${diffNames[aiDiff]})`;
      roleLabel.textContent = '你是: ⚫ 黑棋';
      resizeCanvas();
      updateUI();
    }
    startAiBtn.onclick = startAiGame;

    resetScoreBtn.onclick = () => {
      if (mode !== 'ai') return;
      aiStats = { win: 0, lose: 0, draw: 0 }; saveAiStats(); updateUI();
    };

    function getWinLine(board, x, y, color) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      for (const [dx, dy] of dirs) {
        const line = [{ x, y }];
        for (let s = 1; s < 5; s++) {
          const nx = x + dx * s, ny = y + dy * s;
          if (nx < 0 || nx >= 15 || ny < 0 || ny >= 15 || board[ny][nx] !== color) break;
          line.push({ x: nx, y: ny });
        }
        for (let s = 1; s < 5; s++) {
          const nx = x - dx * s, ny = y - dy * s;
          if (nx < 0 || nx >= 15 || ny < 0 || ny >= 15 || board[ny][nx] !== color) break;
          line.push({ x: nx, y: ny });
        }
        if (line.length >= 5) return line;
      }
      return null;
    }

    function evalPointForColor(board, x, y, color) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      let totalScore = 0;
      for (const [dx, dy] of dirs) {
        let c1 = 0, c2 = 0, nx = x + dx, ny = y + dy;
        while (nx >= 0 && nx < 15 && ny >= 0 && ny < 15 && board[ny][nx] === color) { c1++; nx += dx; ny += dy; }
        const open1 = (nx >= 0 && nx < 15 && ny >= 0 && ny < 15 && board[ny][nx] === 0);
        nx = x - dx; ny = y - dy;
        while (nx >= 0 && nx < 15 && ny >= 0 && ny < 15 && board[ny][nx] === color) { c2++; nx -= dx; ny -= dy; }
        const open2 = (nx >= 0 && nx < 15 && ny >= 0 && ny < 15 && board[ny][nx] === 0);
        const len = 1 + c1 + c2, opens = (open1 ? 1 : 0) + (open2 ? 1 : 0);
        if (len >= 5) totalScore += 100000;
        else if (len === 4) totalScore += (opens === 2 ? 15000 : (opens === 1 ? 2500 : 0));
        else if (len === 3) totalScore += (opens === 2 ? 2000 : (opens === 1 ? 300 : 0));
        else if (len === 2) totalScore += (opens === 2 ? 250 : (opens === 1 ? 40 : 0));
        else totalScore += (opens === 2 ? 20 : (opens === 1 ? 5 : 0));
      }
      return totalScore;
    }

    function getCandidateMoves(board) {
      const candidates = []; let hasPiece = false;
      for (let y = 0; y < 15; y++) {
        for (let x = 0; x < 15; x++) {
          if (board[y][x] !== 0) { hasPiece = true; continue; }
          let near = false;
          for (let dy = -2; dy <= 2 && !near; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const nx = x + dx, ny = y + dy;
              if (nx >= 0 && nx < 15 && ny >= 0 && ny < 15 && board[ny][nx] !== 0) { near = true; break; }
            }
          }
          if (near) candidates.push({ x, y });
        }
      }
      return hasPiece ? candidates : [{ x: 7, y: 7 }];
    }

    function chooseAiMove() {
      const candidates = getCandidateMoves(aiBoard);
      if (candidates.length === 0) return null;
      for (const m of candidates) if (evalPointForColor(aiBoard, m.x, m.y, 2) >= 100000) return m;
      if (aiDiff !== 'easy' || Math.random() < 0.75) {
        for (const m of candidates) if (evalPointForColor(aiBoard, m.x, m.y, 1) >= 100000) return m;
      }
      const scored = candidates.map(m => {
        const atk = evalPointForColor(aiBoard, m.x, m.y, 2);
        const def = evalPointForColor(aiBoard, m.x, m.y, 1);
        const centerBonus = (7 - Math.abs(m.x - 7)) + (7 - Math.abs(m.y - 7));
        const score = aiDiff === 'easy'
          ? atk + def * 0.5 + centerBonus + Math.random() * 180
          : atk * 1.1 + def + centerBonus;
        return { x: m.x, y: m.y, atk, def, score };
      }).sort((a, b) => b.score - a.score);

      if (aiDiff === 'easy') {
        const pool = scored.slice(0, Math.min(4, scored.length));
        return pool[Math.floor(Math.random() * pool.length)];
      }
      if (aiDiff === 'medium' || scored[0].atk >= 15000) return scored[0];

      const topList = scored.slice(0, Math.min(8, scored.length));
      let bestMove = topList[0], bestFinal = -Infinity;
      for (const m of topList) {
        aiBoard[m.y][m.x] = 2;
        let maxPlayerThreat = 0;
        for (const r of getCandidateMoves(aiBoard)) {
          const pAtk = evalPointForColor(aiBoard, r.x, r.y, 1);
          if (pAtk > maxPlayerThreat) maxPlayerThreat = pAtk;
        }
        aiBoard[m.y][m.x] = 0;
        const finalScore = m.atk * 1.15 + m.def * 0.6 - maxPlayerThreat * 0.9;
        if (finalScore > bestFinal) { bestFinal = finalScore; bestMove = m; }
      }
      return bestMove;
    }

    function executePlayerAiMove(x, y) {
      if (aiThinking || aiWinner !== 0 || aiTurn !== 1 || aiBoard[y][x] !== 0) return;
      aiBoard[y][x] = 1; aiLastMove = { x, y }; aiHistory.push({ x, y, color: 1 }); previewPos = null;

      if (getWinLine(aiBoard, x, y, 1)) {
        aiWinner = 1; aiStats.win++; saveAiStats(); updateUI(); startDropAnimation(x, y, 1); return;
      }
      if (aiHistory.length === 225) {
        aiWinner = 3; aiStats.draw++; saveAiStats(); updateUI(); startDropAnimation(x, y, 1); return;
      }

      aiTurn = 2; aiThinking = true; updateUI(); startDropAnimation(x, y, 1);

      aiTimer = setTimeout(() => {
        if (mode !== 'ai') return;
        const move = chooseAiMove();
        if (move) {
          aiBoard[move.y][move.x] = 2; aiLastMove = { x: move.x, y: move.y };
          aiHistory.push({ x: move.x, y: move.y, color: 2 });
          if (getWinLine(aiBoard, move.x, move.y, 2)) {
            aiWinner = 2; aiStats.lose++; saveAiStats();
          } else if (aiHistory.length === 225) {
            aiWinner = 3; aiStats.draw++; saveAiStats();
          } else { aiTurn = 1; }
          aiThinking = false; updateUI(); startDropAnimation(move.x, move.y, 2);
        } else { aiThinking = false; updateUI(); }
      }, 360);
    }

    function updateUI() {
      statusBanner.className = 'status-banner';
      confirmBtn.style.display = 'none'; undoBtn.style.display = 'none';
      restartBtn.style.display = 'none'; shareBtn.style.display = 'none'; resetScoreBtn.style.display = 'none';

      if (mode === 'online') {
        if (!onlineState) return;
        shareBtn.style.display = 'block';
        roleLabel.textContent = myColor === 1 ? '你是: ⚫ 黑棋' : (myColor === 2 ? '你是: ⚪ 白棋' : '旁观');
        myScoreLabel.textContent = '我方胜场'; oppScoreLabel.textContent = '好友胜场';
        const oppId = (socket.id === onlineState.blackId) ? onlineState.whiteId : onlineState.blackId;
        myScoreNum.textContent = (onlineState.scores && onlineState.scores[socket.id]) || 0;
        drawScoreNum.textContent = onlineState.draws || 0;
        oppScoreNum.textContent = (oppId && onlineState.scores && onlineState.scores[oppId]) || 0;

        if (!onlineState.blackId || !onlineState.whiteId) {
          statusBanner.textContent = '等待朋友加入房间...（点击下方复制链接）'; return;
        }
        if (onlineState.winner !== 0) {
          statusBanner.classList.add('status-win');
          if (onlineState.winner === 3) statusBanner.textContent = '平局！棋盘已满';
          else if (onlineState.winner === myColor) statusBanner.textContent = '🎉 恭喜你赢了！';
          else statusBanner.textContent = '😢 你输了，再接再厉！';
          restartBtn.style.display = 'block'; return;
        }
        if (onlineState.turn === myColor) {
          statusBanner.classList.add('status-my-turn'); statusBanner.textContent = '轮到你落子了';
          if (previewPos) confirmBtn.style.display = 'block';
        } else {
          statusBanner.textContent = '等待对方落子...';
        }
      } else if (mode === 'ai') {
        myScoreLabel.textContent = '你赢了'; oppScoreLabel.textContent = 'AI赢了';
        myScoreNum.textContent = aiStats.win; drawScoreNum.textContent = aiStats.draw;
        oppScoreNum.textContent = aiStats.lose; resetScoreBtn.style.display = 'block';

        if (aiWinner !== 0) {
          statusBanner.classList.add('status-win');
          if (aiWinner === 3) statusBanner.textContent = '平局！棋盘已满';
          else if (aiWinner === 1) statusBanner.textContent = '🎉 你战胜了 AI！';
          else statusBanner.textContent = '🤖 AI 获胜了，再来挑战吧！';
          restartBtn.style.display = 'block'; return;
        }
        if (aiTurn === 1) {
          statusBanner.classList.add('status-my-turn'); statusBanner.textContent = '轮到你落子了';
          if (previewPos) confirmBtn.style.display = 'block';
          if (aiHistory.length >= 2) undoBtn.style.display = 'block';
        } else {
          statusBanner.textContent = '🤖 AI 正在思考...';
        }
      }
    }

    function drawBoard(now = performance.now()) {
      ctx.clearRect(0, 0, boardPx, boardPx);
      // 直接贴入渲染好的写实木纹与裂痕底板
      ctx.drawImage(boardBgCanvas, 0, 0, boardPx, boardPx);

      const board = mode === 'online' ? (onlineState && onlineState.board) : aiBoard;
      const lastMove = mode === 'online' ? (onlineState && onlineState.lastMove) : aiLastMove;
      const winner = mode === 'online' ? (onlineState ? onlineState.winner : 0) : aiWinner;
      const canPreview = mode === 'online'
        ? (onlineState && onlineState.turn === myColor && onlineState.winner === 0)
        : (aiTurn === 1 && aiWinner === 0 && !aiThinking);
      const previewColor = mode === 'online' ? myColor : 1;

      if (!board || board.length === 0) return;

      for (let y = 0; y < 15; y++) {
        for (let x = 0; x < 15; x++) {
          if (board[y][x] === 0) continue;
          if (animPiece && animPiece.x === x && animPiece.y === y) continue;
          drawPiece(x, y, board[y][x], false);
        }
      }

      if ((winner === 1 || winner === 2) && lastMove && !animPiece) {
        const winLine = getWinLine(board, lastMove.x, lastMove.y, winner);
        if (winLine) {
          ctx.save();
          ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3;
          for (const pt of winLine) {
            ctx.beginPath();
            ctx.arc(padding + pt.x * cellSize, padding + pt.y * cellSize, cellSize * 0.45, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      if (lastMove && !animPiece && winner === 0) {
        const lx = padding + lastMove.x * cellSize;
        const ly = padding + lastMove.y * cellSize;
        ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
        ctx.strokeRect(lx - 4, ly - 4, 8, 8);
      }

      if (animPiece) {
        const t = Math.min(1, Math.max(0, (now - animPiece.startTime) / animPiece.duration));
        const p = easeOutCubic(t);
        const cx = padding + animPiece.x * cellSize;
        const cy = padding + animPiece.y * cellSize;
        const baseR = cellSize * 0.43;

        if (t > 0.45) {
          const rt = (t - 0.45) / 0.55;
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, baseR * (1 + rt * 0.75), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(38, 18, 4, ${(1 - rt) * 0.5})`;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }

        const scale = 1.48 - 0.48 * p;
        const liftY = -14 * (1 - p);
        const alpha = 0.35 + 0.65 * p;
        drawPieceAtPixel(cx, cy + liftY, baseR * scale, animPiece.color, false, alpha, 14 * (1 - p) + 5, 9 * (1 - p) + 2.5);
      }

      if (previewPos && canPreview) {
        drawPiece(previewPos.x, previewPos.y, previewColor, true);
      }
    }

    function drawPiece(x, y, color, isPreview) {
      const cx = padding + x * cellSize;
      const cy = padding + y * cellSize;
      const r = cellSize * 0.43;
      drawPieceAtPixel(cx, cy, r, color, isPreview, isPreview ? 0.55 : 1, 5, 2.5);
    }

    function drawPieceAtPixel(cx, cy, r, color, isPreview, alpha, shadowBlur, shadowOffsetY) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.06, cx, cy, r);
      if (color === 1) {
        grad.addColorStop(0, '#57534e');
        grad.addColorStop(0.38, '#1c1917');
        grad.addColorStop(1, '#09090b');
      } else {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.6, '#ece9e1');
        grad.addColorStop(1, '#c7c1b5');
      }
      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = shadowBlur;
      ctx.shadowOffsetX = 1.5;
      ctx.shadowOffsetY = shadowOffsetY;
      ctx.fill();

      if (isPreview) {
        ctx.strokeStyle = '#84cc16'; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.restore();
    }

    canvas.addEventListener('pointerdown', (e) => {
      let currentBoard = null;
      if (mode === 'online') {
        if (!onlineState || !onlineState.blackId || !onlineState.whiteId) return;
        if (onlineState.winner !== 0 || onlineState.turn !== myColor) return;
        currentBoard = onlineState.board;
      } else if (mode === 'ai') {
        if (aiThinking || aiWinner !== 0 || aiTurn !== 1) return;
        currentBoard = aiBoard;
      } else { return; }

      const rect = canvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left - padding) / cellSize);
      const y = Math.round((e.clientY - rect.top - padding) / cellSize);

      if (x < 0 || x >= 15 || y < 0 || y >= 15) return;
      if (currentBoard[y][x] !== 0) return;

      if (previewPos && previewPos.x === x && previewPos.y === y) {
        if (mode === 'online') { socket.emit('move', { x, y }); previewPos = null; }
        else { executePlayerAiMove(x, y); }
      } else {
        previewPos = { x, y }; updateUI(); drawBoard();
      }
    });

    confirmBtn.onclick = () => {
      if (!previewPos) return;
      if (mode === 'online') { socket.emit('move', previewPos); previewPos = null; }
      else if (mode === 'ai') { executePlayerAiMove(previewPos.x, previewPos.y); }
    };

    undoBtn.onclick = () => {
      if (mode !== 'ai' || aiThinking || aiWinner !== 0 || aiHistory.length < 2) return;
      if (rafId) cancelAnimationFrame(rafId);
      animPiece = null;
      const lastAi = aiHistory.pop(), lastPlayer = aiHistory.pop();
      aiBoard[lastAi.y][lastAi.x] = 0; aiBoard[lastPlayer.y][lastPlayer.x] = 0;
      aiLastMove = aiHistory.length > 0 ? aiHistory[aiHistory.length - 1] : null;
      previewPos = null; updateUI(); drawBoard();
    };

    restartBtn.onclick = () => {
      if (mode === 'online') socket.emit('restart');
      else if (mode === 'ai') startAiGame();
    };

    shareBtn.onclick = async () => {
      const url = window.location.href;
      try { await navigator.clipboard.writeText(url); alert('邀请链接已复制！\n' + url); }
      catch { prompt('请长按复制下面链接：', url); }
    };

    backBtn.onclick = () => {
      if (aiTimer) clearTimeout(aiTimer);
      if (rafId) cancelAnimationFrame(rafId);
      animPiece = null;
      if (mode === 'online') window.location.href = window.location.pathname;
      else { mode = ''; gameEl.style.display = 'none'; lobbyEl.style.display = 'flex'; }
    };
  </script>
</body>
