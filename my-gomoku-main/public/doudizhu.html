<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="小游戏大厅" />
  <title>欢乐斗地主 - 翡翠绿绒牌桌</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.85) 0%, transparent 45%),
        linear-gradient(180deg, #d5eef9 0%, #e7f5f2 48%, #d7ece5 100%);
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 6px 14px;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    .nav-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      padding: 3px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 8px;
      border: 1px solid #fff;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
    }
    .nav-tab {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      border-radius: 9px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      color: #64748b;
    }
    .nav-tab.active {
      background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }

    #lobby {
      width: 100%;
      max-width: 390px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #fff;
      color: #1e293b;
      padding: 22px 18px;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.1);
      margin-top: 24px;
      text-align: center;
    }
    #lobby h2 { margin: 0 0 6px; font-size: 21px; color: #0f766e; }
    input[type="text"] {
      width: 100%;
      padding: 11px;
      font-size: 16px;
      text-align: center;
      background: #f8fafc;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #0ea5e9; background: #fff; }
    button { border: none; border-radius: 10px; padding: 11px 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:active { transform: scale(0.97); opacity: 0.9; }
    .btn-gold {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #fff;
      width: 100%;
      box-shadow: 0 3px 10px rgba(5, 150, 105, 0.28);
    }
    .btn-light { background: #f1f5f9; color: #475569; width: 100%; margin-top: 8px; font-size: 14px; }

    #table { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 560px; flex: 1; }

    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .hud-pill {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #fff;
      border-radius: 12px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #334155;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }
    .bottom-cards { display: flex; gap: 4px; align-items: center; }
    .mini-card {
      width: 24px;
      height: 33px;
      background: #fff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.05;
    }
    .mini-card.back {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: 1.5px solid #e0f2fe;
      color: #fff;
    }
    .mini-card.red { color: #e11d48; }
    .hud-btn { padding: 5px 9px; font-size: 12px; border-radius: 8px; background: #f1f5f9; color: #334155; }

    /* 阳光翡翠绿绒牌桌 + 象牙白皮质软包边（零木质） */
    .poker-table {
      width: 100%;
      min-height: 295px;
      background-color: #218c5d;
      border: 8px solid #f8fafc;
      border-radius: 140px 140px 38px 38px / 65px 65px 28px 28px;
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.25),
        inset 0 0 32px rgba(6, 78, 59, 0.45),
        0 14px 32px rgba(15, 23, 42, 0.16),
        0 6px 0 #cbd5e1;
      padding: 14px 10px 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .table-watermark {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.14);
      pointer-events: none;
      white-space: nowrap;
    }

    .table-opponents {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      z-index: 2;
      min-height: 118px;
    }
    .opp-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .opp-side.right { align-items: flex-end; text-align: right; }

    .seat-badge {
      background: rgba(255, 255, 255, 0.94);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      padding: 5px 8px;
      max-width: 155px;
      color: #1e293b;
      box-shadow: 0 3px 10px rgba(0,0,0,0.16);
    }
    .seat-badge.active-turn {
      border-color: #facc15;
      background: #fefce8;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.85);
    }
    .seat-badge.empty {
      background: rgba(255, 255, 255, 0.22);
      border: 1.5px dashed rgba(255, 255, 255, 0.75);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }
    .seat-name-row { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .role-tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; font-weight: 800; }
    .role-landlord { background: #e11d48; color: #fff; }
    .role-peasant { background: #0ea5e9; color: #fff; }
    .seat-sub { font-size: 10px; color: #059669; margin-top: 2px; font-weight: 700; }
    .kick-ai { background: #fee2e2; color: #e11d48; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }

    .opp-cards-row { display: flex; align-items: center; gap: 6px; }
    .opp-side.right .opp-cards-row { flex-direction: row-reverse; }
    .card-back-count {
      width: 28px;
      height: 38px;
      background: linear-gradient(145deg, #38bdf8, #0284c7);
      border: 2px solid #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      flex-shrink: 0;
    }

    .played-stack { display: flex; align-items: center; flex-wrap: wrap; padding-left: 10px; animation: popOnTable 0.2s ease-out; }
    @keyframes popOnTable {
      0% { transform: scale(0.82) translateY(8px); opacity: 0.4; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .table-card {
      width: 31px;
      height: 44px;
      background: #fff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      margin-left: -12px;
      padding: 2px 3px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font-weight: 800;
      box-shadow: -1px 2px 6px rgba(0,0,0,0.25);
      position: relative;
      overflow: hidden;
    }
    .table-card.red { color: #e11d48; }
    .table-card .tc-r { font-size: 12px; line-height: 1; }
    .table-card .tc-s { font-size: 11px; line-height: 1; }
    .table-card .tc-j { font-size: 9px; line-height: 1.05; }

    .shout-text {
      font-size: 20px;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 2px 4px rgba(6, 78, 59, 0.85);
      letter-spacing: 1px;
      animation: popOnTable 0.2s ease-out;
    }

    .table-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      min-height: 82px;
      gap: 6px;
    }
    .table-msg {
      background: rgba(255, 255, 255, 0.92);
      color: #065f46;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .table-msg.my-turn {
      background: #facc15;
      color: #422006;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.75);
    }

    .controls { width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 2; min-height: 40px; }
    .controls button {
      padding: 9px 16px;
      font-size: 14px;
      border-radius: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      min-width: 78px;
    }
    .btn-ai { background: linear-gradient(180deg, #6366f1, #4f46e5); color: #fff; }
    .btn-start { background: linear-gradient(180deg, #fbbf24, #d97706); color: #fff; }
    .btn-play { background: linear-gradient(180deg, #38bdf8, #0284c7); color: #fff; }
    .btn-hint { background: linear-gradient(180deg, #fbbf24, #d97706); color: #fff; }
    .btn-pass { background: rgba(255,255,255,0.9); color: #475569; }
    .btn-bid { background: linear-gradient(180deg, #38bdf8, #0284c7); color: #fff; }

    .hand-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 6px 0 10px;
      user-select: none;
    }
    .hand-row { display: flex; justify-content: center; padding-left: 14px; }
    .poker-card {
      width: 42px;
      height: 64px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      margin-left: -14px;
      box-shadow: -2px 3px 8px rgba(15, 23, 42, 0.16);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 3px 4px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.12s;
      color: #1e293b;
      position: relative;
      overflow: hidden;
    }
    .poker-card.red { color: #e11d48; }
    .poker-card.selected {
      transform: translateY(-16px);
      border-color: #0ea5e9;
      background: #f0f9ff;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
    }
    .card-rank { font-size: 15px; line-height: 1; }
    .card-suit { font-size: 14px; line-height: 1.1; }
    .card-joker { font-size: 10px; line-height: 1.05; letter-spacing: 0.5px; }

    .landlord-ribbon {
      position: absolute;
      top: 4px;
      right: -13px;
      background: #e11d48;
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      padding: 1px 14px;
      transform: rotate(45deg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      pointer-events: none;
    }

    .bottom-hud { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
    .my-status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.92);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }
    .tracker-bar {
      width: 100%;
      background: rgba(255, 255, 255, 0.94);
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 4px 4px;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      text-align: center;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }
    .tr-col { border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 1px; }
    .tr-col:last-child { border-right: none; }
    .tr-rank { font-size: 10px; font-weight: 800; color: #0284c7; }
    .tr-cnt { font-size: 11px; font-weight: 800; color: #0f172a; }
    .tr-cnt.zero { color: #cbd5e1; }

    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99;
    }
    .modal-box {
      background: #fff;
      color: #1e293b;
      width: 100%;
      max-width: 340px;
      border-radius: 18px;
      padding: 20px 18px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.25);
    }
    .diff-option {
      width: 100%;
      text-align: left;
      background: #f8fafc;
      color: #1e293b;
      padding: 11px 14px;
      margin-bottom: 8px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
    }
    .diff-option.active { border-color: #0ea5e9; background: #f0f9ff; }
    .diff-sub { display: block; font-size: 12px; font-weight: 400; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="nav-tabs">
    <a href="/" class="nav-tab">⚫ 五子棋</a>
    <a href="/doudizhu.html" class="nav-tab active">🃏 斗地主</a>
  </div>

  <div id="lobby">
    <h2>🃏 欢乐斗地主</h2>
    <p style="margin:0 0 14px; font-size:13px; color:#64748b;">
      支持 1~3 人进房，人数不够可随时点 <strong>AI 补位</strong>
    </p>
    <input type="text" id="nameInput" placeholder="你的昵称（可选）" maxlength="10" />
    <input type="text" id="roomInput" placeholder="房间号，例如 8888" maxlength="20" />
    <button class="btn-gold" id="joinBtn">进入牌桌</button>
    <button class="btn-light" id="randomBtn">随机生成房间号</button>
  </div>

  <div id="table">
    <div class="hud-top">
      <div class="hud-pill">
        <span id="roomLabel">房:-</span>
        <button class="hud-btn" id="shareBtn">邀请</button>
        <button class="hud-btn" id="exitBtn">退出</button>
      </div>
      <div class="hud-pill">
        <div class="bottom-cards" id="bottomCards"></div>
        <span>倍:<strong id="multText" style="color:#0284c7;">×1</strong></span>
      </div>
    </div>

    <div class="poker-table">
      <div class="table-watermark">欢乐斗地主</div>
      <div class="table-opponents">
        <div class="opp-side left" id="leftOpp"></div>
        <div class="opp-side right" id="rightOpp"></div>
      </div>
      <div class="table-center">
        <div class="table-msg" id="msgBanner">等待中...</div>
        <div id="myPlayedZone" style="min-height:46px; display:flex; align-items:center; justify-content:center;"></div>
      </div>
      <div class="controls" id="controlsBar"></div>
    </div>

    <div class="hand-container" id="handContainer"></div>

    <div class="bottom-hud">
      <div class="my-status-strip">
        <span id="myRoleText">我: -</span>
        <span id="myScoreText" style="color:#059669; font-weight:800;">战绩: 0胜 | 0分</span>
      </div>
      <div class="tracker-bar" id="trackerBar"></div>
    </div>
  </div>

  <div class="modal-mask" id="aiModal">
    <div class="modal-box">
      <h3 style="margin:0 0 12px; font-size:18px;">🤖 选择 AI 补位等级</h3>
      <button class="diff-option" data-diff="easy">
        🌱 入门 AI
        <span class="diff-sub">出牌随性，适合休闲娱乐</span>
      </button>
      <button class="diff-option active" data-diff="medium">
        ⚔️ 普通 AI
        <span class="diff-sub">懂得配合队友，会留炸弹</span>
      </button>
      <button class="diff-option" data-diff="hard">
        🧠 高手 AI
        <span class="diff-sub">优先走顺子三带，紧盯残局</span>
      </button>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn-ai" id="addOneAiBtn" style="flex:1; border-radius:10px;">补位 1 个</button>
        <button class="btn-start" id="addAllAiBtn" style="flex:1; border-radius:10px;">补满空位</button>
      </div>
      <button class="btn-light" id="closeModalBtn">取消</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const lobbyEl = document.getElementById('lobby');
    const tableEl = document.getElementById('table');
    const nameInput = document.getElementById('nameInput');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const randomBtn = document.getElementById('randomBtn');
    const roomLabel = document.getElementById('roomLabel');
    const shareBtn = document.getElementById('shareBtn');
    const exitBtn = document.getElementById('exitBtn');
    const bottomCardsEl = document.getElementById('bottomCards');
    const multText = document.getElementById('multText');
    const leftOpp = document.getElementById('leftOpp');
    const rightOpp = document.getElementById('rightOpp');
    const msgBanner = document.getElementById('msgBanner');
    const myPlayedZone = document.getElementById('myPlayedZone');
    const controlsBar = document.getElementById('controlsBar');
    const myRoleText = document.getElementById('myRoleText');
    const myScoreText = document.getElementById('myScoreText');
    const handContainer = document.getElementById('handContainer');
    const trackerBar = document.getElementById('trackerBar');

    const aiModal = document.getElementById('aiModal');
    const diffOptions = document.querySelectorAll('.diff-option');
    let selectedAiDiff = 'medium';
    let state = null;
    let selectedIds = new Set();
    let seenPlayedIds = new Set();

    // 生成高级翡翠绿绒布编织纹理（零木质）
    (function applyFeltTable() {
      const c = document.createElement('canvas');
      const w = 520, h = 320;
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      let s = 314159;
      const rand = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);

      const bg = g.createRadialGradient(w / 2, h * 0.45, 20, w / 2, h / 2, w * 0.65);
      bg.addColorStop(0, '#34a873');
      bg.addColorStop(0.55, '#218759');
      bg.addColorStop(1, '#146642');
      g.fillStyle = bg;
      g.fillRect(0, 0, w, h);

      // 细密毛呢绒布交织颗粒
      for (let i = 0; i < 6500; i++) {
        g.fillStyle = rand() > 0.5 ? 'rgba(255, 255, 255, 0.035)' : 'rgba(4, 47, 29, 0.07)';
        g.fillRect(rand() * w, rand() * h, 1.5, 1.5);
      }

      // 比赛级牌桌内圈细金白走线
      g.strokeStyle = 'rgba(255, 255, 255, 0.22)';
      g.lineWidth = 1.5;
      g.beginPath();
      g.roundRect(18, 16, w - 36, h - 32, [90, 90, 24, 24]);
      g.stroke();

      const tbl = document.querySelector('.poker-table');
      if (tbl) { tbl.style.backgroundImage = `url(${c.toDataURL()})`; tbl.style.backgroundSize = 'cover'; }
    })();

    const urlParams = new URLSearchParams(window.location.search);
    roomInput.value = urlParams.get('room') || Math.floor(1000 + Math.random() * 9000);
    randomBtn.onclick = () => { roomInput.value = Math.floor(1000 + Math.random() * 9000); };

    diffOptions.forEach(btn => {
      btn.onclick = () => {
        diffOptions.forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); selectedAiDiff = btn.dataset.diff;
      };
    });

    joinBtn.onclick = () => {
      const id = roomInput.value.trim();
      if (!id) return alert('请输入房间号');
      socket.emit('ddz:joinRoom', { roomId: id, name: nameInput.value.trim() });
    };

    document.getElementById('addOneAiBtn').onclick = () => { socket.emit('ddz:addAi', { diff: selectedAiDiff, fillAll: false }); aiModal.style.display = 'none'; };
    document.getElementById('addAllAiBtn').onclick = () => { socket.emit('ddz:addAi', { diff: selectedAiDiff, fillAll: true }); aiModal.style.display = 'none'; };
    document.getElementById('closeModalBtn').onclick = () => { aiModal.style.display = 'none'; };

    shareBtn.onclick = async () => {
      const url = window.location.href;
      try { await navigator.clipboard.writeText(url); alert('斗地主房间链接已复制！\n' + url); }
      catch { prompt('请复制链接发给好友：', url); }
    };
    exitBtn.onclick = () => { window.location.href = window.location.pathname; };

    socket.on('ddz:error', (msg) => alert(msg));
    socket.on('ddz:joined', ({ roomId }) => {
      lobbyEl.style.display = 'none'; tableEl.style.display = 'flex';
      roomLabel.textContent = `房:${roomId}`;
      window.history.replaceState({}, '', `${window.location.pathname}?room=${encodeURIComponent(roomId)}`);
    });
    socket.on('ddz:hintResult', (ids) => {
      if (!ids || ids.length === 0) return alert('没有能管上上家的牌，请点“不出”');
      selectedIds = new Set(ids); renderHand();
    });
    socket.on('ddz:state', (newState) => {
      if (newState.phase === 'waiting' || newState.phase === 'bidding') seenPlayedIds.clear();
      else if (newState.phase === 'playing' || newState.phase === 'finished') {
        for (const c of (newState.lastPlayCards || [])) seenPlayedIds.add(c.id);
        for (const s of newState.seats) if (s && s.playedCards) s.playedCards.forEach(c => seenPlayedIds.add(c.id));
      }
      state = newState;
      const myIds = new Set(state.myHand.map(c => c.id));
      selectedIds = new Set([...selectedIds].filter(id => myIds.has(id)));
      render();
    });

    function makeMiniCardsHtml(cards) {
      return cards.map(c => {
        const red = c.color === 'red' ? 'red' : '';
        const text = (c.val >= 16) ? (c.val === 17 ? '大' : '小') : `${c.label}<br>${c.suit}`;
        return `<div class="mini-card ${red}">${text}</div>`;
      }).join('');
    }

    function makeTableCardsHtml(cards, isLandlord) {
      return `<div class="played-stack">` + cards.map((c, idx) => {
        const red = c.color === 'red' ? 'red' : '';
        const ribbon = (isLandlord && idx === cards.length - 1) ? `<div class="landlord-ribbon">地主</div>` : '';
        const inner = c.val >= 16 ? `<span class="tc-j">${c.val === 17 ? '大<br>王' : '小<br>王'}</span>` : `<span class="tc-r">${c.label}</span><span class="tc-s">${c.suit}</span>`;
        return `<div class="table-card ${red}">${ribbon}${inner}</div>`;
      }).join('') + `</div>`;
    }

    function renderOpponent(container, idx) {
      const seat = state.seats[idx];
      const isTurn = (state.phase === 'bidding' || state.phase === 'playing') && state.turnIdx === idx;
      if (!seat) { container.innerHTML = `<div class="seat-badge empty">空座位（待加入）</div>`; return; }

      const roleTag = state.landlordIdx === idx ? `<span class="role-tag role-landlord">地主</span>` : (state.landlordIdx >= 0 ? `<span class="role-tag role-peasant">农民</span>` : '');
      const kickBtn = (state.phase === 'waiting' && seat.type === 'ai') ? `<button class="kick-ai" onclick="removeAi(${idx})">移除</button>` : '';
      const countBox = (state.phase === 'bidding' || state.phase === 'playing') ? `<div class="card-back-count">${seat.cardCount}</div>` : '';

      let playArea = '';
      if (seat.action) playArea = `<div class="shout-text">${seat.action}</div>`;
      else if (seat.playedCards && seat.playedCards.length > 0) playArea = makeTableCardsHtml(seat.playedCards, state.landlordIdx === idx);
      else if (state.phase === 'finished' && seat.revealedHand && seat.revealedHand.length > 0) playArea = makeTableCardsHtml(seat.revealedHand, state.landlordIdx === idx);

      container.innerHTML = `
        <div class="seat-badge ${isTurn ? 'active-turn' : ''}">
          <div class="seat-name-row">${roleTag}<span>${seat.name}</span>${kickBtn}</div>
          <div class="seat-sub">${seat.wins}胜 · ${seat.score >= 0 ? '+' : ''}${seat.score}分</div>
        </div>
        <div class="opp-cards-row">${countBox}${playArea}</div>
      `;
    }
    window.removeAi = (idx) => socket.emit('ddz:removeAi', idx);

    function renderTracker() {
      const ranks = [
        { val: 17, label: '大', total: 1 }, { val: 16, label: '小', total: 1 },
        { val: 15, label: '2', total: 4 }, { val: 14, label: 'A', total: 4 },
        { val: 13, label: 'K', total: 4 }, { val: 12, label: 'Q', total: 4 },
        { val: 11, label: 'J', total: 4 }, { val: 10, label: '10', total: 4 },
        { val: 9, label: '9', total: 4 }, { val: 8, label: '8', total: 4 },
        { val: 7, label: '7', total: 4 }, { val: 6, label: '6', total: 4 },
        { val: 5, label: '5', total: 4 }, { val: 4, label: '4', total: 4 },
        { val: 3, label: '3', total: 4 }
      ];
      const playingOrEnded = state.phase === 'playing' || state.phase === 'finished';
      const myCounts = new Map(); for (const c of state.myHand) myCounts.set(c.val, (myCounts.get(c.val) || 0) + 1);
      const playedCounts = new Map();
      for (const id of seenPlayedIds) {
        const v = id === 53 ? 17 : (id === 52 ? 16 : Math.floor(id / 4) + 3);
        playedCounts.set(v, (playedCounts.get(v) || 0) + 1);
      }
      trackerBar.innerHTML = ranks.map(r => {
        const rem = playingOrEnded ? Math.max(0, r.total - (myCounts.get(r.val) || 0) - (playedCounts.get(r.val) || 0)) : r.total;
        return `<div class="tr-col"><span class="tr-rank">${r.label}</span><span class="tr-cnt ${rem === 0 ? 'zero' : ''}">${rem}</span></div>`;
      }).join('');
    }

    function render() {
      if (!state) return;
      const myIdx = state.mySeatIdx, leftIdx = (myIdx + 2) % 3, rightIdx = (myIdx + 1) % 3;
      multText.textContent = `×${state.multiplier}`;
      bottomCardsEl.innerHTML = (state.bottomCards && state.bottomCards.length === 3)
        ? makeMiniCardsHtml(state.bottomCards)
        : `<div class="mini-card back">?</div><div class="mini-card back">?</div><div class="mini-card back">?</div>`;

      renderOpponent(leftOpp, leftIdx); renderOpponent(rightOpp, rightIdx);

      const mySeat = state.seats[myIdx];
      const isMyTurn = (state.phase === 'bidding' || state.phase === 'playing') && state.turnIdx === myIdx;
      msgBanner.className = 'table-msg' + (isMyTurn ? ' my-turn' : '');
      msgBanner.textContent = state.message;

      const myRole = state.landlordIdx === myIdx ? '👑 地主' : (state.landlordIdx >= 0 ? '🌾 农民' : '待定');
      myRoleText.textContent = `${mySeat.name} (${myRole})`;
      myScoreText.textContent = `战绩: ${mySeat.wins}胜 | ${mySeat.score >= 0 ? '+' : ''}${mySeat.score}分`;

      if (mySeat.action) myPlayedZone.innerHTML = `<div class="shout-text">${mySeat.action}</div>`;
      else if (mySeat.playedCards && mySeat.playedCards.length > 0) myPlayedZone.innerHTML = makeTableCardsHtml(mySeat.playedCards, state.landlordIdx === myIdx);
      else myPlayedZone.innerHTML = '';

      controlsBar.innerHTML = '';
      const hasEmpty = state.seats.some(s => s === null);
      if (state.phase === 'waiting') {
        const btn = document.createElement('button');
        if (hasEmpty) { btn.className = 'btn-ai'; btn.textContent = '🤖 AI 补位（选等级）'; btn.onclick = () => { aiModal.style.display = 'flex'; }; }
        else { btn.className = 'btn-start'; btn.textContent = '🃏 3人已满，开始发牌！'; btn.onclick = () => socket.emit('ddz:startGame'); }
        controlsBar.appendChild(btn);
      } else if (state.phase === 'bidding' && isMyTurn) {
        const passBtn = document.createElement('button'); passBtn.className = 'btn-pass'; passBtn.textContent = '不叫';
        passBtn.onclick = () => socket.emit('ddz:bid', 0); controlsBar.appendChild(passBtn);
        for (let b = 1; b <= 3; b++) {
          if (b > state.highestBid) {
            const bidBtn = document.createElement('button'); bidBtn.className = 'btn-bid'; bidBtn.textContent = `${b} 分`;
            bidBtn.onclick = () => socket.emit('ddz:bid', b); controlsBar.appendChild(bidBtn);
          }
        }
      } else if (state.phase === 'playing' && isMyTurn) {
        if (state.lastPlayCards.length > 0 && state.lastPlaySeat !== myIdx) {
          const passBtn = document.createElement('button'); passBtn.className = 'btn-pass'; passBtn.textContent = '不出';
          passBtn.onclick = () => { selectedIds.clear(); socket.emit('ddz:pass'); }; controlsBar.appendChild(passBtn);
        }
        const hintBtn = document.createElement('button'); hintBtn.className = 'btn-hint'; hintBtn.textContent = '💡 提示';
        hintBtn.onclick = () => socket.emit('ddz:hint'); controlsBar.appendChild(hintBtn);
        const playBtn = document.createElement('button'); playBtn.className = 'btn-play'; playBtn.textContent = '出牌';
        playBtn.onclick = () => { if (selectedIds.size === 0) return alert('请先点选要出的牌'); socket.emit('ddz:play', [...selectedIds]); };
        controlsBar.appendChild(playBtn);
      } else if (state.phase === 'finished') {
        const nextBtn = document.createElement('button'); nextBtn.className = 'btn-start'; nextBtn.textContent = '🃏 再来一局';
        nextBtn.onclick = () => { selectedIds.clear(); socket.emit('ddz:startGame'); }; controlsBar.appendChild(nextBtn);
      }

      renderHand(); renderTracker();
    }

    function renderHand() {
      handContainer.innerHTML = '';
      if (!state || !state.myHand || state.myHand.length === 0) return;
      const cards = state.myHand, isLandlord = state.landlordIdx === state.mySeatIdx;
      const rows = cards.length > 10 ? [cards.slice(0, 10), cards.slice(10)] : [cards];
      rows.forEach((rowCards, rIdx) => {
        const rowEl = document.createElement('div'); rowEl.className = 'hand-row';
        rowCards.forEach((c, cIdx) => {
          const cardEl = document.createElement('div');
          cardEl.className = 'poker-card' + (c.color === 'red' ? ' red' : '') + (selectedIds.has(c.id) ? ' selected' : '');
          const isLastCard = (rIdx === rows.length - 1) && (cIdx === rowCards.length - 1);
          const ribbon = (isLandlord && isLastCard) ? `<div class="landlord-ribbon">地主</div>` : '';
          cardEl.innerHTML = c.val >= 16
            ? `${ribbon}<span class="card-joker">J<br>O<br>K<br>E<br>R</span>`
            : `${ribbon}<span class="card-rank">${c.label}</span><span class="card-suit">${c.suit}</span>`;
          cardEl.onclick = () => {
            if (selectedIds.has(c.id)) selectedIds.delete(c.id); else selectedIds.add(c.id);
            cardEl.classList.toggle('selected');
          };
          rowEl.appendChild(cardEl);
        });
        handContainer.appendChild(rowEl);
      });
    }
  </script>
</body>
</html>
